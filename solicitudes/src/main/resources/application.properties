spring.application.name=solicitudes-consejo-de-facultad

#URL
url.application=/api/unicauca/fiet/consejo/
url.backend=http://localhost:8080
url.frontend=http://localhost:4200

# Server port
server.port=${SERVER_PORT}

# DATASOURCE (MYSQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ruta de anexos cargados (definir en la maquina que se despliegue).
app.uploads.base-path=C:\\Projects\\Trabajo de Grado\\Code\\back\\anexos-solicitudes-consejo

# Table names physically
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl